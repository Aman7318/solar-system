<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Interactive 3D Solar System</title>
  <style>
    body {
      margin: 0; overflow: hidden; background: #000;
      #label {
        position: fixed;
        display: none;
        padding: 4px 10px;
        background: rgba(0, 0, 0, 0.75);
        color: #fff;
        font-family: sans-serif;
        font-size: 14px;
        border: 1px solid #888;
        border-radius: 4px;
        pointer-events: none;
      }
      #info {
        position: fixed;
        top: 20px;
        right: 20px;
        width: 240px;
        padding: 14px 18px;
        background: rgba(0, 0, 0, 0.75);
        color: #fff;
        font-family: sans-serif;
        font-size: 14px;
        border: 1px solid #888;
        border-radius: 6px;
        display: none;
      }
      #info h2 { margin: 0 0 10px; font-size: 20px; }
      #info p { margin: 6px 0; }

      #info button {
        margin-top: 8px;
        padding: 4px 12px;
        background: #222;
        color: #fff;
        border: 1px solid #888;
        border-radius: 4px;
        cursor: pointer;
      }
    }
  </style>
</head>
<body>
  <div id="label"></div>
  <div id="info">
    <h2 id="info-name"></h2>
    <p>Diameter: <span id="info-diameter"></span></p>
    <p>Distance from Sun: <span id="info-distance"></span></p>
    <p>Orbital period: <span id="info-period"></span></p>
    <p>Moons: <span id="info-moons"></span></p>
    <button id="info-close">Close</button>
  </div>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="main.js"></script>
</body>
</html>
